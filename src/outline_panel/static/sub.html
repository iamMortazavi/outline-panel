<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f5ead8" />
<title>Subscription</title>
<!-- No font CDN: this page is opened when the tunnel is down, on networks that
     block Google. The faces are same-origin and font-display:swap, so nothing
     external gates the render. -->
<link rel="stylesheet" href="/static/fonts.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23c67139'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='18' text-anchor='middle' fill='%23f5ead8'%3EO%3C/text%3E%3C/svg%3E">
<script src="/static/i18n.js"></script>
<script src="/static/vendor/qrcode.js"></script>
<style>
  /* Organic, the dashboard's design system, in a sheet of its own: this page
     shares no markup with the dashboard, so it takes the tokens, not the
     classes. Keep the palette in step with organic.css. */
  :root{
    --bg:#f5ead8;--panel:#ebddc5;--panel2:#f8f0e2;--line:rgba(46,33,24,.12);--line2:rgba(46,33,24,.2);
    --text:#2e2118;--muted:#6b5a4a;--faint:#8a7866;--acc:#c67139;--acc-600:#a95c2c;--acc-700:#8c4a22;
    --leaf:#7a8a5e;--leaf-100:#e3e8d6;--leaf-700:#4f5c3b;--acc-100:#f6dcc6;
    --ink:#fdf8ef;--ok:var(--leaf-700);--warn:#a8741b;--danger:var(--acc-700);
    --mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;
    --sans:"Figtree","Vazirmatn",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    --display:"Caprasimo","Vazirmatn",Georgia,serif;
    --r-lg:28px;--r-md:20px;--r-sm:14px;
    color-scheme:light;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;min-height:100dvh;
    padding:env(safe-area-inset-top) 0 calc(40px + env(safe-area-inset-bottom))}
  :lang(fa) *{letter-spacing:0!important}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .wrap{max-width:520px;margin:0 auto;padding:22px 16px 0}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}
  .brand .dot{width:30px;height:30px;border-radius:50%;background:var(--acc);color:var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:17px;line-height:1}
  .brand b{font-family:var(--display);font-weight:400;font-size:20px}
  .brand>span:not(.dot){color:var(--faint);font-size:11.5px;font-weight:700;letter-spacing:.08em;margin-inline-start:auto}

  .hero{position:relative;border-radius:var(--r-lg);padding:24px;background:var(--acc);color:var(--ink);overflow:hidden;margin-bottom:12px}
  .hero::after{content:"";position:absolute;inset-inline-end:-60px;top:-80px;width:210px;height:210px;border-radius:50%;background:rgba(253,248,239,.13)}
  .hero .who{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.15;position:relative;overflow-wrap:anywhere}
  .hero .sub{font-size:11.5px;font-weight:700;opacity:.85;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
  .ring{display:flex;align-items:center;gap:18px;margin-top:18px;position:relative}
  .ring svg{flex:none}
  .ring .track{stroke:rgba(253,248,239,.25)}.ring .arc{stroke:var(--ink)}
  .ring text{fill:var(--ink);font-family:var(--sans);font-weight:800;font-size:17px}
  .ring .big{font-family:var(--display);font-weight:400;font-size:30px;line-height:1}
  .ring .lbl{font-size:13px;opacity:.9;margin-top:6px}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
  .card{background:var(--panel);border-radius:var(--r-md);padding:16px}
  .card .t{font-size:11px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.08em}
  .card .v{font-family:var(--display);font-weight:400;font-size:21px;margin-top:6px}
  .sectitle{font-family:var(--display);font-size:19px;color:var(--text);margin:26px 4px 10px}

  .link{background:var(--panel);border-radius:var(--r-md);padding:16px}
  .link .url{font-family:var(--mono);font-size:12px;color:var(--acc-700);word-break:break-all;line-height:1.5;margin-bottom:12px;background:var(--panel2);border-radius:12px;padding:10px 12px}
  .row{display:flex;gap:9px}
  .btn{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;border:none;border-radius:999px;padding:13px 18px;font-size:14.5px;font-weight:700;font-family:inherit;cursor:pointer;
    background:var(--acc);color:var(--ink);transition:background .15s,transform .1s}
  .btn:hover{background:var(--acc-600)}
  .btn:active{transform:translateY(1px)}
  .btn:focus-visible,.mini:focus-visible,.add:focus-visible,.seg button:focus-visible,.langbtn:focus-visible{outline:3px solid color-mix(in srgb,var(--acc) 45%,transparent);outline-offset:2px}
  .btn-sec{flex:none;background:var(--panel2);color:var(--text);padding:13px 16px}
  .btn-sec:hover{background:#fffaf1}

  .srv{background:var(--panel);border-radius:var(--r-md);padding:16px;margin-bottom:10px}
  .srv-top{display:flex;align-items:center;gap:10px}
  .srv-name{font-weight:700;font-size:15px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;flex:none}
  .pill.ok{background:var(--leaf-100);color:var(--leaf-700)}.pill.off{background:var(--acc-100);color:var(--acc-700)}
  .bar{height:8px;border-radius:999px;background:var(--panel2);overflow:hidden;margin:12px 0 8px}
  .bar>i{display:block;height:100%;border-radius:999px;background:var(--leaf)}
  .srv-sub{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
  /* the ss:// line and byte counts stay LTR inside an RTL page — a URL reordered
     by the bidi algorithm is unreadable and, worse, looks wrong when copied,
     and "24.0 GB" renders as "GB 24.0". Direction only: .big keeps its own face. */
  [dir="rtl"] .url,[dir="rtl"] .mono,[dir="rtl"] .big{direction:ltr;text-align:start;unicode-bidi:embed}
  [dir="rtl"] .url{text-align:left}
  [dir="rtl"] .ring .lbl{direction:rtl}
  .langbtn{background:var(--panel);border:none;color:var(--text);
    border-radius:999px;padding:6px 12px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
  .srv-acts{display:flex;gap:8px;margin-top:12px}
  .mini{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--panel2);border:none;color:var(--text);border-radius:999px;padding:10px 8px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;min-height:40px;white-space:nowrap}
  .mini:hover{background:#fffaf1}
  .mini:active{opacity:.7}
  .mini svg{width:15px;height:15px;flex:none}

  /* connect guide */
  .seg{display:flex;gap:4px;background:var(--panel);border-radius:999px;padding:4px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
  .seg::-webkit-scrollbar{display:none}
  .seg button{flex:1 1 auto;min-width:0;background:none;border:none;color:var(--muted);font:inherit;font-size:13px;font-weight:700;padding:9px 10px;border-radius:999px;cursor:pointer;white-space:nowrap}
  @media (max-width:380px){.seg button{font-size:12px;padding:9px 7px}}
  .seg button.on{background:var(--text);color:var(--bg)}
  .app{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:var(--r-md);padding:12px 14px;margin-bottom:8px}
  .app .ic{width:40px;height:40px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-size:18px;flex:none}
  .app .who2{flex:1;min-width:0}
  .app .nm2{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* wraps rather than ellipsing: on a 375px screen the longer notes are the
     ones that actually tell the user something */
  .app .ds{font-size:12px;color:var(--faint);margin-top:2px;line-height:1.45}
  .add{flex:none;border:none;border-radius:999px;padding:9px 16px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;
    background:var(--acc);color:var(--ink)}
  .add:hover{background:var(--acc-600)}
  .add:active{transform:translateY(1px)}
  .steps{background:var(--leaf-100);border-radius:var(--r-md);padding:14px 16px;margin-bottom:12px}
  .steps li{font-size:13px;color:var(--leaf-700);line-height:1.6;margin-bottom:4px}
  .steps li:last-child{margin-bottom:0}
  .steps b{color:var(--text)}
  .steps ol{margin:0;padding:0;padding-inline-start:22px}
  .hint{font-size:12px;color:var(--faint);line-height:1.55;margin:4px 6px 0}

  .center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:70vh;gap:10px;padding:24px}
  .spin{width:24px;height:24px;border:3px solid var(--line2);border-top-color:var(--acc);border-radius:50%;animation:rot .7s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}
  .emoji{width:72px;height:72px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-size:32px}
  .ttl{font-family:var(--display);font-weight:400;font-size:22px}.muted{color:var(--muted)}
  .foot{text-align:center;color:var(--faint);font-size:12.5px;margin-top:24px}
  .foot a{color:var(--acc-700);font-weight:700;cursor:pointer;text-decoration:none}

  /* qr modal */
  .scrim{position:fixed;inset:0;background:rgba(46,33,24,.45);backdrop-filter:blur(3px);z-index:40;display:none;align-items:center;justify-content:center;padding:24px}
  .scrim.on{display:flex}
  .qrbox{background:var(--bg);border-radius:var(--r-lg);padding:22px;max-width:320px;width:100%;text-align:center;box-shadow:0 24px 60px -20px rgba(46,33,24,.45)}
  .qrbox .qr{background:#fff;border-radius:var(--r-md);padding:16px;margin:8px auto 16px;width:230px;max-width:78vw}
  .qrbox .qr svg{width:100%;height:auto;display:block}
  .qrbox .nm{font-family:var(--display);font-size:19px;margin-bottom:2px}
  #toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);background:var(--text);color:var(--bg);padding:11px 20px;border-radius:999px;font-size:13.5px;font-weight:700;z-index:60;opacity:0;transition:.25s;pointer-events:none}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
  <div id="app"><div class="center"><span class="spin"></span></div></div>
  <div class="scrim" id="scrim"><div class="qrbox"><div class="nm" id="qrnm"></div><div class="qr" id="qr"></div><button class="btn btn-sec" id="qrclose" style="width:100%" onclick="closeQR()">Close</button></div></div>
  <div id="toast"></div>
<script>
/* This page is reached two ways: the long-standing `/sub/<token>` on the panel
   domain, and the short `/<token>` on the customer profile host. Stripping only
   the `/sub/` prefix left the short form's token as "/1-abc" — leading slash and
   all — which then 404'd against an endpoint that had the key perfectly well. */
const token=decodeURIComponent(
  location.pathname.replace(/^\/sub\//,'').replace(/^\//,'').replace(/\/.*$/,''));
/* Advertise the address the customer actually arrived on, so the link they copy
   is the short one when there is a short one. */
const onProfileHost=!/^\/sub\//.test(location.pathname);
const subUrl=location.origin+(onProfileHost?'/':'/sub/')+token;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fmtB(n){if(n==null)return '∞';n=Number(n);const u=['B','KB','MB','GB','TB'];let i=0;while(Math.abs(n)>=1024&&i<u.length-1){n/=1024;i++;}return (n>=100||i===0?n.toFixed(0):n.toFixed(1))+' '+u[i];}
function expiry(ts){if(!ts)return{t:t('No expiry'),d:null};const left=ts-Date.now()/1000;if(left<=0)return{t:t('Expired'),d:'expired'};const d=Math.floor(left/86400),h=Math.floor((left%86400)/3600);return{t:(d>0?d+'d '+h+'h':h+'h'),d:new Date(ts*1000).toLocaleDateString()};}
let toastT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.className='on';clearTimeout(toastT);toastT=setTimeout(()=>t.className='',1800);}
async function copy(text){try{await navigator.clipboard.writeText(text);}catch(e){const a=document.createElement('textarea');a.value=text;a.style.position='fixed';a.style.opacity=0;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove();}toast(t('Copied'));}
function showQR(name,text){const box=document.getElementById('qr');box.innerHTML='';try{const q=qrcode(0,'M');q.addData(text);q.make();box.innerHTML=q.createSvgTag({cellSize:7,margin:2,scalable:true});}catch(e){box.textContent='QR';}document.getElementById('qrnm').textContent=name;document.getElementById('scrim').className='scrim on';}
function closeQR(){document.getElementById('scrim').className='scrim';}
document.getElementById('scrim').onclick=e=>{if(e.target.id==='scrim')closeQR();};

/* ---------- client apps ----------
   One table on purpose. App names and their import URL schemes are the part of
   this page that goes stale — they change every year or two — so there is
   exactly one place to edit when they do, and nothing else in the page knows an
   app name. `link(sub)` builds the app's one-tap import URL from the
   subscription link; an app with no `link` is added from the Configs section
   below instead. A scheme that isn't installed simply does nothing, which is
   why every row still has the copy button underneath as a fallback. */
const APPS={
  outline:{name:'Outline',note:'Official app — simplest',icon:'🔑',perServer:true},
  hiddify:{name:'Hiddify',note:'Imports the whole subscription',icon:'⚡',
           link:s=>'hiddify://install-sub?url='+encodeURIComponent(s)},
  streisand:{name:'Streisand',note:'Popular on iPhone',icon:'🌊',
           link:s=>'streisand://import/'+s},
  shadowrocket:{name:'Shadowrocket',note:'Paid · App Store',icon:'🚀',
           link:s=>'sub://'+btoa(s).replace(/=+$/,'')},
  v2rayng:{name:'v2rayNG',note:'Widely used on Android',icon:'🅥',
           link:s=>'v2rayng://install-sub?url='+encodeURIComponent(s)},
  clash:{name:'Clash / Verge',note:'Desktop & Android',icon:'⚔️',
           link:s=>'clash://install-config?url='+encodeURIComponent(s)},
  singbox:{name:'sing-box',note:'Cross-platform',icon:'📦',
           link:s=>'sing-box://import-remote-profile?url='+encodeURIComponent(s)},
};
const PLATFORMS=[
  {id:'ios',     label:'iPhone', apps:['outline','streisand','shadowrocket','hiddify','singbox']},
  {id:'android', label:'Android',apps:['outline','hiddify','v2rayng','singbox','clash']},
  {id:'windows', label:'Windows',apps:['outline','hiddify','clash']},
  {id:'macos',   label:'macOS',  apps:['outline','hiddify','streisand','clash']},
  {id:'linux',   label:'Linux',  apps:['outline','hiddify','singbox']},
];
function detectPlatform(){
  const u=navigator.userAgent||'';
  if(/iPhone|iPad|iPod/i.test(u))return 'ios';
  if(/Android/i.test(u))return 'android';
  if(/Windows|Win64|Win32/i.test(u))return 'windows';
  if(/Mac OS X|Macintosh/i.test(u))return 'macos';
  return 'linux';
}
let PLAT=detectPlatform(), DATA=null;
I18N.apply();
function nextLangLabel(){const l=I18N.languages.find(x=>x.id!==I18N.lang);return l?l.label:'';}
function toggleLang(){const l=I18N.languages.find(x=>x.id!==I18N.lang);if(l){I18N.setLang(l.id);paintStatic();render(DATA);}}
// the QR dialog lives outside render()'s subtree, so it is painted separately
function paintStatic(){const b=document.getElementById('qrclose');if(b)b.textContent=t('Close');}
paintStatic();

function connectSection(d){
  const p=PLATFORMS.find(x=>x.id===PLAT)||PLATFORMS[0];
  const first=(d.servers||[])[0];
  const seg=PLATFORMS.map(x=>'<button data-plat="'+x.id+'" class="'+(x.id===PLAT?'on':'')+'">'+esc(x.label)+'</button>').join('');
  const rows=p.apps.map(id=>{
    const a=APPS[id];if(!a)return '';
    // Outline takes one ss:// config at a time, not a subscription link
    const href=a.perServer?(first&&first.url):(a.link?a.link(subUrl):null);
    const note=a.perServer&&(d.servers||[]).length>1
      ? t('Adds the first server — use Configs below for the rest') : t(a.note);
    return '<div class="app"><div class="ic">'+a.icon+'</div>'+
      '<div class="who2"><div class="nm2">'+esc(a.name)+'</div><div class="ds">'+esc(note)+'</div></div>'+
      (href?'<button class="add" data-open="'+esc(href)+'">'+esc(t('Add'))+'</button>':'')+'</div>';
  }).join('');
  return '<div class="sectitle">'+esc(t('Connect'))+'</div>'+
    '<div class="seg" id="seg">'+seg+'</div>'+
    '<div class="steps"><ol>'+
      '<li>'+esc(t('Install one of the apps below.'))+'</li>'+
      '<li>'+t('Tap <b>Add</b> — the app opens and imports your subscription.')+'</li>'+
      '<li>'+esc(t('Press connect. Your data and expiry update automatically.'))+'</li>'+
    '</ol></div>'+rows+
    '<div class="hint">'+
      esc(t('Nothing happened? The app probably isn’t installed yet. Install it, '+
            'then copy the subscription link above and paste it in the app.'))+'</div>';
}

function ring(pct){const r=30,c=2*Math.PI*r,off=c*(1-Math.min(pct,100)/100);
  return '<svg width="74" height="74" viewBox="0 0 74 74" aria-hidden="true"><circle class="track" cx="37" cy="37" r="'+r+'" fill="none" stroke-width="8"/><circle class="arc" cx="37" cy="37" r="'+r+'" fill="none" stroke-width="8" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" transform="rotate(-90 37 37)"/><text x="37" y="43" text-anchor="middle">'+Math.round(pct)+'%</text></svg>';}

function render(d){
  const used=d.used||0, total=d.total||0, unlimited=d.unlimited||total===0;
  const pct=unlimited?0:Math.min(100,used/total*100);
  const remain=unlimited?null:Math.max(0,total-used);
  const ex=expiry(d.expire);
  const multi=(d.servers||[]).length>1;
  let h='<div class="wrap"><div class="brand"><span class="dot" aria-hidden="true">O</span><b>Outline</b><span>'+esc(t('SUBSCRIPTION'))+'</span>'+
     '<button class="langbtn" id="lang" style="margin-inline-start:10px">'+esc(nextLangLabel())+'</button></div>';
  h+='<div class="hero"><div class="sub">'+esc(t('Data used'))+'</div><div class="who">'+esc(d.name)+'</div>'+
     '<div class="ring">'+(unlimited?'<div><div class="big">'+fmtB(used)+'</div><div class="lbl">'+esc(t('Unlimited plan'))+'</div></div>':
        ring(pct)+'<div><div class="big">'+fmtB(used)+'</div><div class="lbl">'+esc(t('of'))+' <span class="mono">'+fmtB(total)+'</span> · <span class="mono">'+fmtB(remain)+'</span> '+esc(t('left'))+'</div></div>')+'</div></div>';
  // A plan that hasn't started has no expiry_ts, which used to render as
  // "No expiry" — telling someone who bought 30 days that it never ends.
  const pend=d.pendingDays||0;
  const expVal=pend?(pend+' '+t('days')):ex.t;
  const expNote=pend?t('starts on first connection')
                    :(ex.d&&ex.d!=='expired'?ex.d:'');
  h+='<div class="grid2"><div class="card"><div class="t">'+esc(t(pend?'Validity':'Expiry'))+'</div><div class="v" style="'+(!pend&&ex.d==='expired'?'color:var(--danger)':(pend?'color:var(--warn)':''))+'">'+esc(expVal)+'</div>'+(expNote?'<div style="font-size:11.5px;color:var(--faint);margin-top:3px">'+esc(expNote)+'</div>':'')+'</div>'+
     '<div class="card"><div class="t">'+esc(t('Configs'))+'</div><div class="v">'+(d.servers||[]).length+' '+esc(t(multi?'servers':'server'))+'</div><div style="font-size:11.5px;color:var(--faint);margin-top:3px">'+esc(t('auto-updates'))+' ~'+(d.updateInterval||12)+esc(t('h'))+'</div></div></div>';

  h+='<div class="sectitle">'+esc(t('Subscription link'))+'</div><div class="link"><div class="url">'+esc(subUrl)+'</div><div class="row"><button class="btn" onclick="copy(subUrl)">'+esc(t('Copy link'))+'</button><button class="btn btn-sec" onclick="showQR(\'Subscription\',subUrl)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3M21 14v3M14 21h3" stroke-linecap="round"/></svg></button></div></div>';

  h+=connectSection(d);

  if((d.servers||[]).length){
    h+='<div class="sectitle">'+esc(t('Configs'))+'</div>';
    h+=d.servers.map(s=>{const un=(s.limit==null);const p=un?0:Math.min(100,(s.used||0)/s.limit*100);
      return '<div class="srv"><div class="srv-top"><div class="srv-name">'+esc(s.server)+'</div><span class="pill '+(s.disabled?'off':'ok')+'">'+esc(t(s.disabled?'Off':'Active'))+'</span></div>'+
        '<div class="bar"><i style="width:'+(un?100:Math.max(p,2))+'%;opacity:'+(un?.45:1)+'"></i></div>'+
        '<div class="srv-sub"><span class="mono">'+fmtB(s.used)+' / '+(un?'∞':fmtB(s.limit))+'</span><span>'+(un?esc(t('Unlimited')):Math.round(p)+'%')+'</span></div>'+
        '<div class="srv-acts"><div class="mini" data-copy="'+esc(s.url)+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>'+esc(t('Copy config'))+'</div>'+
        '<div class="mini" data-qr="'+esc(s.url)+'" data-nm="'+esc(s.server)+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>QR</div>'+
        // ss:// is Outline's own scheme, so this hands the config straight to the app
        '<div class="mini" data-open="'+esc(s.url)+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>'+esc(t('Open'))+'</div></div></div>';
    }).join('');
  }
  h+='<div class="foot">'+esc(t('Auto-updates in your app'))+' · <a onclick="boot()">'+esc(t('Refresh'))+'</a></div></div>';
  document.getElementById('app').innerHTML=h;
  document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copy(b.dataset.copy));
  document.querySelectorAll('[data-qr]').forEach(b=>b.onclick=()=>showQR(b.dataset.nm,b.dataset.qr));
  document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>{PLAT=b.dataset.plat;render(DATA);});
  const lb=document.getElementById('lang');if(lb)lb.onclick=toggleLang;
  // A custom scheme with no app registered is silently ignored by the browser,
  // so say what to do next rather than leaving the tap looking broken.
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{
    location.href=b.dataset.open;
    setTimeout(()=>{if(!document.hidden)toast(t('App not installed yet — install it, then tap Add'));},1200);
  });
}
function fail(msg){document.getElementById('app').innerHTML='<div class="center"><div class="emoji" aria-hidden="true">🔗</div><div class="ttl">'+esc(msg)+'</div><div class="muted">'+esc(t('Check the link, or ask your provider for a new one.'))+'</div></div>';}
async function boot(){
  try{const r=await fetch('/sub/'+encodeURIComponent(token)+'/info',{headers:{'Accept':'application/json'}});
    if(r.status===404)return fail(t('Subscription not found'));
    if(!r.ok)return fail(t('Could not load subscription'));
    DATA=await r.json();   // kept so switching platform re-renders without a fetch
    render(DATA);
  }catch(e){fail(t('Could not load subscription'));}
}
boot();
</script>
</body>
</html>
