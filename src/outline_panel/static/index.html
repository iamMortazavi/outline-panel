<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5ead8">
<meta name="color-scheme" content="light">
<title>Outline Panel</title>
<!-- No web-font CDN on purpose: this panel runs where fonts.googleapis.com is
     blocked. The faces are vendored under /static/vendor/fonts; the two Latin
     ones are preloaded because every screen opens with them. -->
<link rel="preload" href="/static/vendor/fonts/figtree-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/vendor/fonts/caprasimo-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/fonts.css?v=__V__">
<link rel="stylesheet" href="/static/organic.css?v=__V__">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23c67139'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='18' text-anchor='middle' fill='%23f5ead8'%3EO%3C/text%3E%3C/svg%3E">
</head>
<body>
<div id="root"></div>
<div id="modalRoot"></div>
<div id="toast" aria-live="polite"></div>
<!-- Deferred and in order: the translator first, the QR library, then the app. -->
<script src="/static/i18n.js?v=__V__" defer></script>
<script src="/static/vendor/qrcodejs.min.js" defer></script>
<script src="/static/app.js?v=__V__" defer></script>
</body>
</html>
